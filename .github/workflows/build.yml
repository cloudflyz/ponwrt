name: Build ZN504XG-D

# 唯一构建入口：
#   · 打 v* tag  → 构建并自动发布 Release（主路径）
#   · 手动 dispatch → 只出 artifact；勾 publish 才发布
#   · mode=toolchain → 只编工具链，用于预热缓存

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: an7581
        type: choice
        options:
          - an7581
          - an7583
      mode:
        description: '构建范围（toolchain 只预热工具链缓存）'
        required: true
        default: firmware
        type: choice
        options:
          - firmware
          - toolchain
      publish:
        description: '发布到 Release（仅 dispatch 生效，需填 tag）'
        required: true
        default: false
        type: boolean
      tag:
        description: '发布用 tag（publish=true 时必填，如 v2026.11.03-1200）'
        required: false
        default: ''
        type: string
      ssh:
        description: '开启 tmate SSH 调试（仅仓库所有者）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PROFILE: znxt_zn504xg-d

jobs:
  build:
    name: Build ${{ inputs.target || 'an7581' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 参数归一：push 触发时 inputs 为空，统一回落到默认值
      # ---------------------------------------------------------------
      - name: Resolve parameters
        id: p
        run: |
          TARGET="${{ inputs.target || 'an7581' }}"
          MODE="${{ inputs.mode || 'firmware' }}"
          WEEK="$(date +%Y%W)"

          case "$TARGET" in
            an7583|an7581) ;;
            *) echo "::error::不支持的 target: $TARGET"; exit 1 ;;
          esac

          # 源码无关的配置哈希，用于 dl 缓存失效判断
          CFG_HASH="$(cat feeds.conf.default configs/*.config | sha256sum | cut -c1-16)"

          echo "target=$TARGET"     >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"         >> "$GITHUB_OUTPUT"
          echo "week=$WEEK"         >> "$GITHUB_OUTPUT"
          echo "cfg_hash=$CFG_HASH" >> "$GITHUB_OUTPUT"

          {
            echo "### 构建参数"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| target | $TARGET |"
            echo "| profile | $PROFILE |"
            echo "| mode | $MODE |"
            echo "| commit | $GITHUB_SHA |"
            echo "| ref | $GITHUB_REF |"
            echo "| 配置哈希 | $CFG_HASH |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: SSH debug (tmate)
        if: >-
          inputs.ssh == true
          && github.actor == github.repository_owner
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

      # ---------------------------------------------------------------
      # 缓存键：工具链键按「源码里 tools/toolchain 的 Makefile 内容」算，
      # 源码不动就一直命中；周号只用于 dl/ccache，避免每次 run 存新副本。
      # ---------------------------------------------------------------
      - name: Compute toolchain cache key
        id: tk
        run: |
          TOOLS_HASH="$(find tools toolchain -type f \( -name 'Makefile' -o -name '*.mk' \) \
            -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -c1-16)"
          echo "key=ponwrt-toolchain-airoha-${{ steps.p.outputs.target }}-${TOOLS_HASH}" >> "$GITHUB_OUTPUT"
          echo "工具链缓存键: ponwrt-toolchain-airoha-${{ steps.p.outputs.target }}-${TOOLS_HASH}"

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ steps.p.outputs.target }}-${{ steps.p.outputs.cfg_hash }}
          restore-keys: |
            ponwrt-dl-${{ steps.p.outputs.target }}-

      - name: Cache toolchain
        id: tk-restore
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: ${{ steps.tk.outputs.key }}
          restore-keys: |
            ponwrt-toolchain-airoha-${{ steps.p.outputs.target }}-

      # build_dir 的 gcc 编译目录单独缓存；只恢复 staging 仍会重编工具链
      - name: Cache toolchain build dir
        id: tcb
        uses: actions/cache@v4
        with:
          path: build_dir/toolchain-*
          key: ${{ steps.tk.outputs.key }}-build

      - name: Report toolchain cache
        run: |
          if [ "${{ steps.tk-restore.outputs.cache-hit }}" = "true" ]; then
            echo "工具链缓存命中，跳过工具链编译" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "工具链缓存未命中，本次需要完整编译工具链" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure ${{ steps.p.outputs.target }}
        run: |
          # kconfig.pl 一次只接受两个操作数，按顺序链式合并
          ./scripts/kconfig.pl + "configs/${{ steps.p.outputs.target }}.config" configs/release.config > .config.base
          ./scripts/kconfig.pl + .config.base configs/zn504-extra.config > .config
          rm -f .config.base
          make defconfig

      # ---------------------------------------------------------------
      # defconfig 会把 feeds 里不存在的包静默剔除，编完才发现就晚了。
      # 这里显式校验：机型符号、PON 核心链路、附加包。
      # ---------------------------------------------------------------
      - name: Verify profile and packages
        run: |
          fail=0
          DEV_SYM="CONFIG_TARGET_DEVICE_airoha_${{ steps.p.outputs.target }}_DEVICE_${PROFILE}"
          if ! grep -q "^${DEV_SYM}=y" .config; then
            echo "::error::机型符号 ${DEV_SYM} 未选中"
            grep -n 'zn504' .config || true
            fail=1
          fi

          for p in kmod-airoha-xpon kmod-airoha-pon-frontend airoha-ponctl airoha-pond luci-app-pon; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "::error::PON 关键包 ${p} 在 defconfig 后缺失"
              echo "  诊断: 包目录 $([ -d "package/${p}" ] && echo 存在 || echo 不存在)；feeds 链接 $([ -e "package/feeds/*/${p}" ] && echo 存在 || echo 未知)"
              fail=1
            fi
          done

          for p in luci-app-ttyd luci-app-sqm luci-app-wol; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || { echo "::error::缺少附加包 ${p}"; fail=1; }
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "机型 + PON 链路 + 附加包校验通过"

      - name: Build toolchain only
        if: steps.p.outputs.mode == 'toolchain'
        run: make tools/install toolchain/install -j"$(nproc)" V=s

      - name: Download sources
        if: steps.p.outputs.mode == 'firmware'
        run: make download -j"$(nproc)" V=s

      - name: Build firmware
        id: compile
        if: steps.p.outputs.mode == 'firmware'
        run: make -j"$(nproc)" V=s

      # ---------------------------------------------------------------
      # 收集：镜像 + manifest + SHA256SUMS + 构建信息
      # ---------------------------------------------------------------
      - name: Collect images
        if: steps.p.outputs.mode == 'firmware'
        run: |
          TARGET="${{ steps.p.outputs.target }}"
          BIN="bin/targets/airoha/$TARGET"
          mkdir -p out

          ls -l "$BIN"
          ls "$BIN" | grep -q "${PROFILE}" \
            || { echo "::error::没有产出 ${PROFILE} 镜像"; exit 1; }

          cp -v "$BIN"/*${PROFILE}* out/
          cp -v "$BIN"/*.manifest "$BIN"/profiles.json "$BIN"/sha256sums out/ 2>/dev/null || true

          {
            echo "target: $TARGET"
            echo "profile: $PROFILE"
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "config_sha256: $(sha256sum .config | cut -d' ' -f1)"
            echo "build_time: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "runner: ubuntu-24.04"
            echo "toolchain_cache_hit: ${{ steps.tk-restore.outputs.cache-hit }}"
            echo
            echo "images:"
            ls -l out/*.bin | awk '{print "  " $5 " " $9}'
          } > out/buildinfo.txt
          cat out/buildinfo.txt

          (cd out && sha256sum * > SHA256SUMS.txt)

          # 整包备份单独放到 full/，不进 Release（约 370MB）
          mkdir -p full
          tar --zstd -cf "full/ponwrt-$TARGET-full.tar.zst" -C bin/targets/airoha "$TARGET"
          (cd full && sha256sum * > SHA256SUMS-full.txt)

          {
            echo "### 产物"
            echo ""
            echo '```'
            cat out/buildinfo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: steps.p.outputs.mode == 'firmware'
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ steps.p.outputs.target }}-zn504xg-d
          path: out/*
          retention-days: 30

      # 整包另存，保留 3 天，不占 Release
      - name: Upload full backup
        if: steps.p.outputs.mode == 'firmware'
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ steps.p.outputs.target }}-full
          path: full/*
          retention-days: 3

      # ---------------------------------------------------------------
      # 发布：tag push 或 dispatch+publish=true
      # ---------------------------------------------------------------
      - name: Publish release
        if: >-
          steps.p.outputs.mode == 'firmware'
          && (github.ref_type == 'tag' || inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          TARGET="${{ steps.p.outputs.target }}"
          if [ -z "$TAG" ]; then
            echo "::error::publish=true 但未填 tag"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，替换其资产"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          {
            echo "## ZN504XG-D 固件（$TARGET）"
            echo ""
            echo '```'
            cat out/buildinfo.txt
            echo '```'
          } > /tmp/notes.md

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PonWrt ZN504XG-D $TAG ($TARGET)" \
            --notes-file /tmp/notes.md \
            out/*

      # ---------------------------------------------------------------
      # 清理：保留最近 3 个 Release，其余连 tag 一起删
      # ---------------------------------------------------------------
      - name: Cleanup old releases
        if: >-
          steps.p.outputs.mode == 'firmware'
          && (github.ref_type == 'tag' || inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=3
          mapfile -t TAGS < <(gh release list --repo "$GITHUB_REPOSITORY" \
            --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName')

          echo "现有 Release: ${TAGS[*]}"
          for i in "${!TAGS[@]}"; do
            if [ "$i" -lt "$KEEP" ]; then
              echo "保留: ${TAGS[$i]}"
            else
              echo "删除: ${TAGS[$i]}"
              gh release delete "${TAGS[$i]}" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes </dev/null || true
            fi
          done
