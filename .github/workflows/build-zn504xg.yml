name: Build ZN504XG-D firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: an7581
        type: choice
        options:
          - an7581
          - an7583

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd lrzsz

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ inputs.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ inputs.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure ${{ inputs.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ inputs.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Verify ZN504XG-D is enabled
        run: |
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_znxt_zn504xg-d=y' .config \
            || { echo "device profile missing"; exit 1; }

      - name: Download sources
        run: make download -j"$(nproc)" V=s

      - name: Build ${{ inputs.target }}
        run: make -j"$(nproc)" V=s

      - name: Collect images
        run: |
          mkdir -p out
          ls -l bin/targets/airoha/${{ inputs.target }}/
          cp -v bin/targets/airoha/${{ inputs.target }}/*znxt_zn504xg-d* out/ || true
          cp -v bin/targets/airoha/${{ inputs.target }}/*.manifest bin/targets/airoha/${{ inputs.target }}/profiles.json bin/targets/airoha/${{ inputs.target }}/sha256sums out/ 2>/dev/null || true
          sha256sum out/* > out/SHA256SUMS.txt
          tar --zstd -cf out/ponwrt-${{ inputs.target }}-full.tar.zst \
            -C bin/targets/airoha "${{ inputs.target }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ inputs.target }}-zn504xg-d
          path: out/*
          retention-days: 30
