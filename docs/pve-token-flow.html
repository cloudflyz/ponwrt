<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;font-family:'WenQuanYi Zen Hei','Noto Sans CJK SC',sans-serif;}
  text{fill:#1f2937;}
  .ttl{font-size:30px;font-weight:bold;}
  .sub{font-size:16px;fill:#6b7280;}
  .sec{font-size:19px;font-weight:bold;fill:#111827;}
  .stepnum{font-size:19px;font-weight:bold;fill:#ffffff;}
  .card-t{font-size:17px;font-weight:bold;fill:#111827;}
  .card-b{font-size:15px;fill:#374151;}
  .mono{font-family:'DejaVu Sans Mono',monospace;font-size:14px;fill:#1d4ed8;}
  .ok-t{font-size:16px;font-weight:bold;fill:#065f46;}
  .ok-b{font-size:15px;fill:#065f46;}
  .no-t{font-size:16px;font-weight:bold;fill:#991b1b;}
  .no-b{font-size:15px;fill:#991b1b;}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1180" fill="#ffffff"/>

  <!-- 标题 -->
  <text class="ttl" x="40" y="58">PVE 受限授权流程 · 只给单台 VM 的电源与控制台</text>
  <text class="sub" x="40" y="88">API Token + 自定义角色，全程不需要把宿主机 root 交出去</text>

  <!-- 区段标题 -->
  <text class="sec" x="40" y="132">① 你在 PVE 网页上操作（约 3 分钟）</text>
  <text class="sec" x="790" y="132">② 管家这一侧</text>

  <!-- 步骤卡片 -->
  <!-- 1 -->
  <rect x="40" y="150" width="700" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="150" width="46" height="104" rx="10" fill="#2563eb"/>
  <text class="stepnum" x="56" y="208">1</text>
  <text class="card-t" x="106" y="182">Datacenter → Permissions → Roles → Create</text>
  <text class="card-b" x="106" y="208">新建角色 VmPowerOnly，只勾三项：</text>
  <text class="mono" x="106" y="234">VM.PowerMgmt  ·  VM.Audit  ·  VM.Console</text>

  <!-- 2 -->
  <rect x="40" y="268" width="700" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="268" width="46" height="86" rx="10" fill="#2563eb"/>
  <text class="stepnum" x="56" y="318">2</text>
  <text class="card-t" x="106" y="300">Users → Add</text>
  <text class="card-b" x="106" y="326">建 openclaw@pve（PVE 认证域，不用设密码，仅走 token）</text>

  <!-- 3 -->
  <rect x="40" y="368" width="700" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="368" width="46" height="104" rx="10" fill="#2563eb"/>
  <text class="stepnum" x="56" y="426">3</text>
  <text class="card-t" x="106" y="400">API Tokens → Add</text>
  <text class="card-b" x="106" y="426">User 选 openclaw@pve，Token ID 填 vmctl</text>
  <text class="card-b" x="106" y="452">取消 Privilege Separation；UUID 只显示一次，先复制</text>

  <!-- 4 -->
  <rect x="40" y="486" width="700" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="486" width="46" height="104" rx="10" fill="#2563eb"/>
  <text class="stepnum" x="56" y="544">4</text>
  <text class="card-t" x="106" y="518">Permissions → Add → API Token</text>
  <text class="card-b" x="106" y="544">Path = /vms/300（只那一台；多台逐个加或放进 /pool/build）</text>
  <text class="card-b" x="106" y="570">Role = VmPowerOnly，Propagate 勾上</text>

  <!-- 5 -->
  <rect x="40" y="604" width="700" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="604" width="46" height="104" rx="10" fill="#2563eb"/>
  <text class="stepnum" x="56" y="662">5</text>
  <text class="card-t" x="106" y="636">把 UUID 交给管家</text>
  <text class="card-b" x="106" y="662">不要贴在聊天里，用 OpenClaw secrets 以掩码方式录入</text>
  <text class="card-b" x="106" y="688">配置里只存引用，运行时注入；随时可在 PVE 删除 token 失效</text>

  <!-- 右侧：管家侧 3 卡 -->
  <rect x="790" y="150" width="570" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="card-t" x="812" y="182">SecretRef：PVE_TOKEN</text>
  <text class="card-b" x="812" y="208">openclaw@pve!vmctl=&lt;UUID&gt;，只在本机内存中出现</text>
  <text class="card-b" x="812" y="232">不进聊天记录、不写明文配置</text>

  <rect x="790" y="266" width="570" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="card-t" x="812" y="298">HTTPS 调用 PVE API</text>
  <text class="mono" x="812" y="326">/api2/json/nodes/&lt;node&gt;/qemu/300/status/{start|stop}</text>
  <text class="card-b" x="812" y="348">status/current 查状态；vncproxy 拿控制台票据</text>

  <rect x="790" y="382" width="570" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="card-t" x="812" y="414">作用范围：只有 /vms/300</text>
  <text class="card-b" x="812" y="440">碰不到别的 VM、宿主机 shell、存储池、备份</text>
  <text class="card-b" x="812" y="464">VM 内日常操作走 SSH（你提供的账号）</text>

  <!-- 箭头：步骤5 → 右侧 第一卡 -->
  <path d="M740 656 C 765 656, 765 198, 788 198" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ar2)"/>
  <!-- 右侧卡之间 -->
  <path d="M1075 246 L1075 264" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M1075 362 L1075 380" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 权限边界 -->
  <text class="sec" x="40" y="790">③ 权限边界</text>

  <rect x="40" y="806" width="640" height="330" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
  <text class="ok-t" x="66" y="842">允许（就能做这些）</text>
  <text class="ok-b" x="66" y="880">· 开机 / 关机 / 强制停止 / 重启 VM 300</text>
  <text class="ok-b" x="66" y="912">· 查询运行状态（running / stopped）</text>
  <text class="ok-b" x="66" y="944">· 打开控制台：截图看 GRUB、内核 panic、登录界面</text>
  <text class="ok-b" x="66" y="976">· 控制台内敲键盘（救场、选启动项）</text>
  <text class="ok-b" x="66" y="1008">· 这些动作仅限 path 里列出的 VM</text>
  <text class="ok-b" x="66" y="1052" style="fill:#047857">撤销方式：PVE 里删掉 token，立即失效</text>

  <rect x="720" y="806" width="640" height="330" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="1.8"/>
  <text class="no-t" x="746" y="842">禁止（给不了这些）</text>
  <text class="no-b" x="746" y="880">· 修改 VM 配置、加减硬盘、改启动顺序</text>
  <text class="no-b" x="746" y="912">· 动其他任何 VM</text>
  <text class="no-b" x="746" y="944">· 宿主机 shell / root / pct / 存储池操作</text>
  <text class="no-b" x="746" y="976">· QEMU Monitor（VM.Monitor 未授权）</text>
  <text class="no-b" x="746" y="1008">· 删除、克隆、快照、备份（VM.Allocate 未授权）</text>
  <text class="no-b" x="746" y="1052" style="fill:#b91c1c">超出范围的动作 API 直接返回 403</text>

  <!-- 底部注记 -->
  <text class="sub" x="40" y="1168">提示：编译结束时让 VM 自己 poweroff，宿主机侧只需「开机」一个动作，权限可以再收紧。</text>
</svg>
</body>
</html>
